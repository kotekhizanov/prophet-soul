[project]
name = "prophet-soul"
version = "0.4.0"
description = "Soul: a Prophet plugin that shows memory's things and links as a 3D graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prophet-soul = "prophet_soul.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prophet_soul"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
